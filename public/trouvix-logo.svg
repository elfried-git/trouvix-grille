<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0f0f"/>
      <stop offset="100%" stop-color="#0d0808"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d97a"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#9f1239"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)" stroke="url(#gold)" stroke-width="6"/>
  <!-- 2x2 square grid (the game's signature shape) -->
  <!-- Top-left cell: red -->
  <rect x="136" y="136" width="100" height="100" rx="20" fill="url(#red)"/>
  <!-- Top-right cell: gold -->
  <rect x="276" y="136" width="100" height="100" rx="20" fill="url(#gold)"/>
  <!-- Bottom-left cell: gold -->
  <rect x="136" y="276" width="100" height="100" rx="20" fill="url(#gold)"/>
  <!-- Bottom-right cell: red -->
  <rect x="276" y="276" width="100" height="100" rx="20" fill="url(#red)"/>
  <!-- Golden ring around the 2x2 block (the "formed square" highlight) -->
  <rect x="124" y="124" width="264" height="264" rx="28" fill="none" stroke="url(#gold)" stroke-width="8" opacity="0.6"/>
</svg>
