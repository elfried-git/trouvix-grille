# Railway configuration for Trouvix Grille Game Service
# Railway auto-detects Bun and uses this config

[deploy]
startCommand = "bun index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Environment variables (set in Railway dashboard):
# PORT — auto-set by Railway
# BENCHOU_PIN — set to your secret PIN (default: 331991)
